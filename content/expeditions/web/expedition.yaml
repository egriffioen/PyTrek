id: web
title: "The Case of the Missing Trail Markers"
summary: >-
  CS 111's web unit: HTTP, HTML and BeautifulSoup, URLs, robots.txt, crawling,
  images, charts, and regular expressions.
story: >-
  Someone has been tampering with the park's website: trail pages point the
  wrong way, pages have vanished, and hikers are getting lost. As a junior
  ranger-detective, you'll track down the culprit and shut it down.
# Names are placeholders until chosen (docs/decisions.md §10).
characters:
  mentor:
    name: Ruth Calloway
    role: Senior Ranger, Pythonia National Park
  agent:
    name: SCOUT-7
# Shown on the first visit, then re-readable from the map.
briefing: briefing.md
reviews: reviews.yaml
# Simulated website the fake `requests` module serves (https://trailnet.test).
site: site
# Python loaded before every activity: fake requests + helpers for checks.
harness: harness.py
# Recommended order (students may open any lesson). Draft order follows the story.
lessons: [http, html, urls, robots, crawling, images, charts, regex]
